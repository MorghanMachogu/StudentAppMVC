<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Course | UniManage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f0f4f8; }
        .navbar { background: linear-gradient(90deg, #1a237e, #283593); }
        .navbar-brand, .nav-link { color: #fff !important; }
        .form-card { border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">StudentManage</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-house me-1"></i>Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/students"><i class="bi bi-people me-1"></i>Students</a></li>
                <li class="nav-item"><a class="nav-link active" href="/courses"><i class="bi bi-book me-1"></i>Courses</a></li>
                <li class="nav-item"><a class="nav-link" href="/registrations"><i class="bi bi-journal-check me-1"></i>Registrations</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-md-7">

            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/courses">Courses</a></li>
                    <li class="breadcrumb-item active">Add New Course</li>
                </ol>
            </nav>

            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
                <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card form-card">
                <div class="card-header bg-success text-white rounded-top py-3">
                    <h5 class="mb-0"><i class="bi bi-plus-circle-fill me-2"></i>Add New Course</h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/courses/add}" th:object="${course}" method="post" novalidate>

                        <div class="mb-3">
                            <label for="courseName" class="form-label fw-semibold">Course Name <span class="text-danger">*</span></label>
                            <input type="text" id="courseName" th:field="*{courseName}"
                                   class="form-control" th:classappend="${#fields.hasErrors('courseName')} ? 'is-invalid'"
                                   placeholder="e.g. Introduction to Algorithms">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('courseName')}" th:errors="*{courseName}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="courseCode" class="form-label fw-semibold">Course Code <span class="text-danger">*</span></label>
                            <input type="text" id="courseCode" th:field="*{courseCode}"
                                   class="form-control" th:classappend="${#fields.hasErrors('courseCode')} ? 'is-invalid'"
                                   placeholder="e.g. COMP201"
                                   style="text-transform: uppercase;">
                            <div class="form-text text-muted">Must be unique across all courses.</div>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('courseCode')}" th:errors="*{courseCode}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="lecturer" class="form-label fw-semibold">Lecturer <span class="text-danger">*</span></label>
                            <input type="text" id="lecturer" th:field="*{lecturer}"
                                   class="form-control" th:classappend="${#fields.hasErrors('lecturer')} ? 'is-invalid'"
                                   placeholder="e.g. Dr. Alice Mwangi">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('lecturer')}" th:errors="*{lecturer}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="credits" class="form-label fw-semibold">Credits <span class="text-danger">*</span></label>
                            <select id="credits" th:field="*{credits}"
                                    class="form-select" th:classappend="${#fields.hasErrors('credits')} ? 'is-invalid'">
                                <option value="">-- Select Credits --</option>
                                <option value="1">1 Credit</option>
                                <option value="2">2 Credits</option>
                                <option value="3">3 Credits</option>
                                <option value="4">4 Credits</option>
                                <option value="5">5 Credits</option>
                                <option value="6">6 Credits</option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('credits')}" th:errors="*{credits}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success px-4">
                                <i class="bi bi-check-circle me-1"></i>Save Course
                            </button>
                            <a href="/courses" class="btn btn-outline-secondary px-4">
                                <i class="bi bi-x-circle me-1"></i>Cancel
                            </a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
