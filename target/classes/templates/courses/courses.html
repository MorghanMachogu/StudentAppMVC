<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses | UniManage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f0f4f8; }
        .navbar { background: linear-gradient(90deg, #1a237e, #283593); }
        .navbar-brand, .nav-link { color: #fff !important; }
        .table-hover tbody tr:hover { background-color: #e8f5e9; }
        .credit-badge { background-color: #2E7D32; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">StudentManage</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-house me-1"></i>Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/students"><i class="bi bi-people me-1"></i>Students</a></li>
                <li class="nav-item"><a class="nav-link active" href="/courses"><i class="bi bi-book me-1"></i>Courses</a></li>
                <li class="nav-item"><a class="nav-link" href="/registrations"><i class="bi bi-journal-check me-1"></i>Registrations</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container pb-5">

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-0">Course Catalogue</h3>
            <p class="text-muted mb-0">Manage all university courses</p>
        </div>
        <a href="/courses/add" class="btn btn-success">
            <i class="bi bi-plus-circle-fill me-2"></i>Add Course
        </a>
    </div>

    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-body p-0">
            <div th:if="${courses.isEmpty()}" class="text-center py-5 text-muted">
                <i class="bi bi-journal-x display-4 d-block mb-3"></i>
                <p class="mb-2">No courses found.</p>
                <a href="/courses/add" class="btn btn-sm btn-outline-success">Add the first course</a>
            </div>
            <div th:if="${!courses.isEmpty()}">
                <table class="table table-hover table-striped mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>#</th>
                            <th>Course Code</th>
                            <th>Course Name</th>
                            <th>Lecturer</th>
                            <th>Credits</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="course, iter : ${courses}">
                            <td class="text-muted" th:text="${iter.count}"></td>
                            <td><span class="badge bg-secondary" th:text="${course.courseCode}"></span></td>
                            <td class="fw-semibold" th:text="${course.courseName}"></td>
                            <td><i class="bi bi-person-badge me-1 text-muted"></i><span th:text="${course.lecturer}"></span></td>
                            <td><span class="badge credit-badge" th:text="${course.credits} + ' Credits'"></span></td>
                            <td class="text-center">
                                <a th:href="@{/registrations/register(courseId=${course.id})}" class="btn btn-sm btn-outline-info me-1" title="Register Student">
                                    <i class="bi bi-person-plus"></i>
                                </a>
                                <a th:href="@{/courses/edit/{id}(id=${course.id})}" class="btn btn-sm btn-outline-secondary me-1" title="Edit">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{/courses/delete/{id}(id=${course.id})}" method="post" class="d-inline"
                                      onsubmit="return confirm('Delete this course? All registrations for this course will also be removed.')">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <p class="text-muted small mt-2" th:if="${!courses.isEmpty()}">
        Showing <strong th:text="${courses.size()}"></strong> course(s)
    </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
