<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register for Course | UniManage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f0f4f8; }
        .navbar { background: linear-gradient(90deg, #1a237e, #283593); }
        .navbar-brand, .nav-link { color: #fff !important; }
        .form-card { border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">StudentManage</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-house me-1"></i>Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/students"><i class="bi bi-people me-1"></i>Students</a></li>
                <li class="nav-item"><a class="nav-link" href="/courses"><i class="bi bi-book me-1"></i>Courses</a></li>
                <li class="nav-item"><a class="nav-link active" href="/registrations"><i class="bi bi-journal-check me-1"></i>Registrations</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-md-7">

            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/registrations">Registrations</a></li>
                    <li class="breadcrumb-item active">Register for Course</li>
                </ol>
            </nav>

            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
                <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card form-card">
                <div class="card-header bg-warning text-dark rounded-top py-3">
                    <h5 class="mb-0"><i class="bi bi-clipboard-plus-fill me-2"></i>Register Student for a Course</h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/registrations/register}" method="post">

                        <!-- Student -->
                        <div class="mb-3">
                            <label for="studentId" class="form-label fw-semibold">Select Student <span class="text-danger">*</span></label>
                            <select id="studentId" name="studentId" class="form-select" required>
                                <option value="">-- Select a Student --</option>
                                <option th:each="student : ${students}"
                                        th:value="${student.id}"
                                        th:text="${student.name} + ' (' + ${student.program} + ', Year ' + ${student.yearOfStudy} + ')'"
                                        th:selected="${selectedStudentId != null and selectedStudentId == student.id}">
                                </option>
                            </select>
                        </div>

                        <!-- Course -->
                        <div class="mb-3">
                            <label for="courseId" class="form-label fw-semibold">Select Course <span class="text-danger">*</span></label>
                            <select id="courseId" name="courseId" class="form-select" required>
                                <option value="">-- Select a Course --</option>
                                <option th:each="course : ${courses}"
                                        th:value="${course.id}"
                                        th:text="${course.courseCode} + ' — ' + ${course.courseName} + ' (' + ${course.credits} + ' Credits)'">
                                </option>
                            </select>
                        </div>

                        <!-- Semester -->
                        <div class="mb-4">
                            <label for="semester" class="form-label fw-semibold">Semester <span class="text-danger">*</span></label>
                            <select id="semester" name="semester" class="form-select" required>
                                <option value="">-- Select Semester --</option>
                                <option th:each="sem : ${semesters}" th:value="${sem}" th:text="${sem}"></option>
                            </select>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-warning px-4 fw-semibold">
                                <i class="bi bi-check-circle me-1"></i>Register
                            </button>
                            <a href="/registrations" class="btn btn-outline-secondary px-4">
                                <i class="bi bi-x-circle me-1"></i>Cancel
                            </a>
                        </div>

                    </form>
                </div>
            </div>

            <!-- Helper note -->
            <div class="alert alert-info mt-3 small">
                <i class="bi bi-info-circle me-2"></i>
                A student cannot be registered for the same course in the same semester more than once.
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
