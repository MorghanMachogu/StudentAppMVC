<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Courses | UniManage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f0f4f8; }
        .navbar { background: linear-gradient(90deg, #1a237e, #283593); }
        .navbar-brand, .nav-link { color: #fff !important; }
        .student-header { background: linear-gradient(135deg, #1565C0, #42A5F5); border-radius: 16px; color: white; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">StudentManage</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-house me-1"></i>Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/students"><i class="bi bi-people me-1"></i>Students</a></li>
                <li class="nav-item"><a class="nav-link" href="/courses"><i class="bi bi-book me-1"></i>Courses</a></li>
                <li class="nav-item"><a class="nav-link active" href="/registrations"><i class="bi bi-journal-check me-1"></i>Registrations</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container pb-5">

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Student Info Header -->
    <div class="student-header p-4 mb-4">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <h4 class="fw-bold mb-1"><i class="bi bi-person-circle me-2"></i><span th:text="${student.name}"></span></h4>
                <p class="mb-1 opacity-75" th:text="${student.email}"></p>
                <div class="d-flex gap-2 flex-wrap">
                    <span class="badge bg-white text-dark" th:text="${student.program}"></span>
                    <span class="badge bg-white text-dark" th:text="'Year ' + ${student.yearOfStudy}"></span>
                </div>
            </div>
            <a th:href="@{/registrations/register(studentId=${student.id})}" class="btn btn-light fw-semibold">
                <i class="bi bi-plus-circle me-1"></i>Register for Course
            </a>
        </div>
    </div>

    <!-- Registered Courses Table -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0">Registered Courses</h5>
        <span class="badge bg-primary" th:text="${registrations.size()} + ' course(s)'"></span>
    </div>

    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-body p-0">
            <div th:if="${registrations.isEmpty()}" class="text-center py-5 text-muted">
                <i class="bi bi-journal-x display-4 d-block mb-3"></i>
                <p class="mb-2">No courses registered yet.</p>
                <a th:href="@{/registrations/register(studentId=${student.id})}" class="btn btn-sm btn-outline-warning">
                    Register for a course →
                </a>
            </div>
            <table class="table table-hover mb-0" th:if="${!registrations.isEmpty()}">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Course Code</th>
                        <th>Course Name</th>
                        <th>Lecturer</th>
                        <th>Credits</th>
                        <th>Semester</th>
                        <th class="text-center">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="reg, iter : ${registrations}">
                        <td class="text-muted" th:text="${iter.count}"></td>
                        <td><span class="badge bg-secondary" th:text="${reg.course.courseCode}"></span></td>
                        <td class="fw-semibold" th:text="${reg.course.courseName}"></td>
                        <td th:text="${reg.course.lecturer}"></td>
                        <td><span class="badge bg-success" th:text="${reg.course.credits} + ' Cr'"></span></td>
                        <td><span class="badge bg-info text-dark" th:text="${reg.semester}"></span></td>
                        <td class="text-center">
                            <form th:action="@{/registrations/drop/{id}(id=${reg.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Drop this course? This cannot be undone.')">
                                <input type="hidden" name="studentId" th:value="${student.id}">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Drop Course">
                                    <i class="bi bi-dash-circle me-1"></i>Drop
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
                <tfoot class="table-light">
                    <tr>
                        <td colspan="4" class="text-end fw-semibold text-muted">Total Credits:</td>
                        <td colspan="3">
                            <span class="badge bg-dark fs-6"
                                  th:text="${#aggregates.sum(registrations.![course.credits])} + ' Credits'"></span>
                        </td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>

    <div class="mt-3 d-flex gap-2">
        <a href="/registrations" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>Back to Registrations
        </a>
        <a th:href="@{/students/{id}(id=${student.id})}" class="btn btn-outline-primary btn-sm">
            <i class="bi bi-person me-1"></i>View Student Profile
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
