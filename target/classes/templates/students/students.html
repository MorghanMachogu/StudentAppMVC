<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students | UniManage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f0f4f8; }
        .navbar { background: linear-gradient(90deg, #1a237e, #283593); }
        .navbar-brand, .nav-link { color: #fff !important; }
        .table-hover tbody tr:hover { background-color: #e8eaf6; }
        .badge-year { background-color: #1565C0; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-mortarboard-fill me-2"></i>UniManage</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-house me-1"></i>Dashboard</a></li>
                <li class="nav-item"><a class="nav-link active" href="/students"><i class="bi bi-people me-1"></i>Students</a></li>
                <li class="nav-item"><a class="nav-link" href="/courses"><i class="bi bi-book me-1"></i>Courses</a></li>
                <li class="nav-item"><a class="nav-link" href="/registrations"><i class="bi bi-journal-check me-1"></i>Registrations</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container pb-5">

    <!-- Alerts -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-0">Student Records</h3>
            <p class="text-muted mb-0">Manage all registered students</p>
        </div>
        <a href="/students/add" class="btn btn-primary">
            <i class="bi bi-person-plus-fill me-2"></i>Add Student
        </a>
    </div>

    <!-- Table -->
    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-body p-0">
            <div th:if="${students.isEmpty()}" class="text-center py-5 text-muted">
                <i class="bi bi-person-x display-4 d-block mb-3"></i>
                <p class="mb-2">No students found.</p>
                <a href="/students/add" class="btn btn-sm btn-outline-primary">Add the first student</a>
            </div>
            <div th:if="${!students.isEmpty()}">
                <table class="table table-hover table-striped mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Program</th>
                            <th>Year</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="student, iter : ${students}">
                            <td class="text-muted" th:text="${iter.count}"></td>
                            <td>
                                <a th:href="@{/students/{id}(id=${student.id})}"
                                   class="fw-semibold text-decoration-none text-primary"
                                   th:text="${student.name}"></a>
                            </td>
                            <td th:text="${student.email}"></td>
                            <td th:text="${student.program}"></td>
                            <td><span class="badge badge-year" th:text="'Year ' + ${student.yearOfStudy}"></span></td>
                            <td class="text-center">
                                <a th:href="@{/students/{id}(id=${student.id})}" class="btn btn-sm btn-outline-info me-1" title="View Profile">
                                    <i class="bi bi-eye"></i>
                                </a>
                                <a th:href="@{/registrations/student/{id}(id=${student.id})}" class="btn btn-sm btn-outline-warning me-1" title="View Registrations">
                                    <i class="bi bi-journal-check"></i>
                                </a>
                                <a th:href="@{/students/edit/{id}(id=${student.id})}" class="btn btn-sm btn-outline-secondary me-1" title="Edit">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{/students/delete/{id}(id=${student.id})}" method="post" class="d-inline"
                                      onsubmit="return confirm('Are you sure you want to delete this student? This will also remove their registrations.')">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Count -->
    <p class="text-muted small mt-2" th:if="${!students.isEmpty()}">
        Showing <strong th:text="${students.size()}"></strong> student(s)
    </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
