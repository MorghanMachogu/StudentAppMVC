<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrations | UniManage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f0f4f8; }
        .navbar { background: linear-gradient(90deg, #1a237e, #283593); }
        .navbar-brand, .nav-link { color: #fff !important; }
        .student-card { border: none; border-radius: 12px; transition: transform 0.15s, box-shadow 0.15s; }
        .student-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">StudentManage</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-house me-1"></i>Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/students"><i class="bi bi-people me-1"></i>Students</a></li>
                <li class="nav-item"><a class="nav-link" href="/courses"><i class="bi bi-book me-1"></i>Courses</a></li>
                <li class="nav-item"><a class="nav-link active" href="/registrations"><i class="bi bi-journal-check me-1"></i>Registrations</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container pb-5">

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-0">Course Registrations</h3>
            <p class="text-muted mb-0">Select a student to view or manage their registrations</p>
        </div>
        <a href="/registrations/register" class="btn btn-warning">
            <i class="bi bi-clipboard-plus-fill me-2"></i>New Registration
        </a>
    </div>

    <div th:if="${students.isEmpty()}" class="text-center py-5 text-muted">
        <i class="bi bi-people display-4 d-block mb-3"></i>
        <p>No students found. <a href="/students/add">Add a student first.</a></p>
    </div>

    <div class="row g-3" th:if="${!students.isEmpty()}">
        <div class="col-md-4 col-sm-6" th:each="student : ${students}">
            <div class="card student-card p-3">
                <div class="d-flex align-items-center gap-3">
                    <div class="rounded-circle bg-primary d-flex align-items-center justify-content-center text-white fw-bold"
                         style="width:48px; height:48px; font-size:1.2rem;"
                         th:text="${#strings.substring(student.name,0,1).toUpperCase()}"></div>
                    <div class="flex-grow-1 overflow-hidden">
                        <div class="fw-semibold text-truncate" th:text="${student.name}"></div>
                        <div class="text-muted small text-truncate" th:text="${student.program}"></div>
                        <span class="badge bg-primary mt-1" th:text="'Year ' + ${student.yearOfStudy}"></span>
                    </div>
                </div>
                <div class="d-flex gap-2 mt-3">
                    <a th:href="@{/registrations/student/{id}(id=${student.id})}" class="btn btn-sm btn-outline-primary flex-grow-1">
                        <i class="bi bi-eye me-1"></i>View Courses
                    </a>
                    <a th:href="@{/registrations/register(studentId=${student.id})}" class="btn btn-sm btn-outline-success">
                        <i class="bi bi-plus"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
