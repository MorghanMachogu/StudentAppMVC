<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile | UniManage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f0f4f8; }
        .navbar { background: linear-gradient(90deg, #1a237e, #283593); }
        .navbar-brand, .nav-link { color: #fff !important; }
        .avatar-circle {
            width: 90px; height: 90px; border-radius: 50%;
            background: linear-gradient(135deg, #1565C0, #42A5F5);
            display: flex; align-items: center; justify-content: center;
            font-size: 2.2rem; color: white; font-weight: bold;
        }
        .profile-card { border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-mortarboard-fill me-2"></i>UniManage</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-house me-1"></i>Dashboard</a></li>
                <li class="nav-item"><a class="nav-link active" href="/students"><i class="bi bi-people me-1"></i>Students</a></li>
                <li class="nav-item"><a class="nav-link" href="/courses"><i class="bi bi-book me-1"></i>Courses</a></li>
                <li class="nav-item"><a class="nav-link" href="/registrations"><i class="bi bi-journal-check me-1"></i>Registrations</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container pb-5">
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/students">Students</a></li>
            <li class="breadcrumb-item active" th:text="${student.name}"></li>
        </ol>
    </nav>

    <div class="row g-4">
        <!-- Profile Card -->
        <div class="col-md-4">
            <div class="card profile-card p-4 text-center">
                <div class="d-flex justify-content-center mb-3">
                    <div class="avatar-circle" th:text="${#strings.substring(student.name, 0, 1).toUpperCase()}"></div>
                </div>
                <h4 class="fw-bold" th:text="${student.name}"></h4>
                <p class="text-muted mb-1" th:text="${student.email}"></p>
                <span class="badge bg-primary mb-3" th:text="'Year ' + ${student.yearOfStudy}"></span>
                <p class="text-muted small" th:text="${student.program}"></p>
                <hr>
                <div class="d-grid gap-2">
                    <a th:href="@{/students/edit/{id}(id=${student.id})}" class="btn btn-outline-warning btn-sm">
                        <i class="bi bi-pencil me-1"></i>Edit Profile
                    </a>
                    <a th:href="@{/registrations/student/{id}(id=${student.id})}" class="btn btn-outline-info btn-sm">
                        <i class="bi bi-journal-check me-1"></i>View Registrations
                    </a>
                    <a th:href="@{/registrations/register(studentId=${student.id})}" class="btn btn-outline-success btn-sm">
                        <i class="bi bi-plus-circle me-1"></i>Register for Course
                    </a>
                </div>
            </div>
        </div>

        <!-- Details Card -->
        <div class="col-md-8">
            <div class="card profile-card p-4">
                <h5 class="fw-bold mb-4"><i class="bi bi-person-lines-fill me-2 text-primary"></i>Student Details</h5>
                <table class="table table-borderless">
                    <tbody>
                        <tr>
                            <th class="text-muted" style="width:35%">Student ID</th>
                            <td th:text="'STU-' + ${student.id}"></td>
                        </tr>
                        <tr>
                            <th class="text-muted">Full Name</th>
                            <td th:text="${student.name}"></td>
                        </tr>
                        <tr>
                            <th class="text-muted">Email Address</th>
                            <td><a th:href="'mailto:' + ${student.email}" th:text="${student.email}"></a></td>
                        </tr>
                        <tr>
                            <th class="text-muted">Program</th>
                            <td th:text="${student.program}"></td>
                        </tr>
                        <tr>
                            <th class="text-muted">Year of Study</th>
                            <td><span class="badge bg-primary" th:text="'Year ' + ${student.yearOfStudy}"></span></td>
                        </tr>
                    </tbody>
                </table>

                <!-- Registered Courses Mini-List -->
                <hr>
                <h6 class="fw-semibold mb-3"><i class="bi bi-journal-check me-2 text-success"></i>Registered Courses</h6>
                <div th:if="${student.registrations == null or student.registrations.isEmpty()}" class="text-muted small">
                    No courses registered yet. <a th:href="@{/registrations/register(studentId=${student.id})}">Register now →</a>
                </div>
                <ul class="list-group list-group-flush" th:if="${student.registrations != null and !student.registrations.isEmpty()}">
                    <li class="list-group-item px-0 d-flex justify-content-between align-items-center"
                        th:each="reg : ${student.registrations}">
                        <span>
                            <span class="badge bg-secondary me-2" th:text="${reg.course.courseCode}"></span>
                            <span th:text="${reg.course.courseName}"></span>
                        </span>
                        <small class="text-muted" th:text="${reg.semester}"></small>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <div class="mt-3">
        <a href="/students" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>Back to Students
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
